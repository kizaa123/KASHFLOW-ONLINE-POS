<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Notifications - KASHFLOW</title>
  <script>
    (function () {
      try { document.documentElement.setAttribute('data-theme', JSON.parse(localStorage.getItem('kf_theme')) || 'dark'); }
      catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/store.js"></script>
  <script src="js/guard.js"></script>
</head>
<body class="app-body">
  <aside id="sidebar"></aside>

  <main class="content">
    <header class="page-header">
      <div>
        <h1><i class="fa-solid fa-bell"></i> Notifications</h1>
        <p class="muted">Welcome back, <span id="welcomeName">admin</span></p>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Switch theme" aria-label="Switch theme"><i class="fa-solid fa-moon"></i></button>
      </div>
    </header>

    <section class="notif-summary">
      <div class="notif-stat">
        <i class="fa-solid fa-right-to-bracket"></i>
        <div><span class="muted-small">Last login</span><strong id="lastLogin">—</strong></div>
      </div>
      <div class="notif-stat">
        <i class="fa-solid fa-envelope-open"></i>
        <div><span class="muted-small">Unread</span><strong id="unreadTotal">0</strong></div>
      </div>
      <div class="notif-stat warn">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div><span class="muted-small">Low stock items</span><strong id="lowTotal">0</strong></div>
      </div>
      <div class="notif-stat ok">
        <i class="fa-solid fa-cart-shopping"></i>
        <div><span class="muted-small">Sales today</span><strong id="salesToday">0</strong></div>
      </div>
    </section>

    <div class="toolbar notif-toolbar">
      <div class="chips" id="typeChips">
        <button type="button" class="chip active" data-type="all">All</button>
        <button type="button" class="chip" data-type="sale">Sales</button>
        <button type="button" class="chip" data-type="low">Low stock</button>
        <button type="button" class="chip" data-type="product">Products</button>
        <button type="button" class="chip" data-type="login">Logins</button>
      </div>
      <div class="notif-actions">
        <button type="button" id="markAllBtn" class="btn-purple small"><i class="fa-solid fa-check-double"></i> Mark all as read</button>
        <button type="button" id="clearAllBtn" class="btn-outline-red"><i class="fa-solid fa-trash"></i> Clear all</button>
      </div>
    </div>

    <section class="panel table-panel">
      <ul class="notif-list" id="notifList"></ul>
      <p id="emptyState" class="empty-state" hidden><i class="fa-regular fa-bell-slash"></i> No notifications yet.</p>
    </section>

    <footer id="appFooter"></footer>
  </main>

  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
