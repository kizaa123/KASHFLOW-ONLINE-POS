<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trial ended - KASHFLOW</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body lock-body">
  <main class="login-card setup-card lock-card" role="main">
    <div class="lock-logo" aria-hidden="true">
      <span class="setup-logo"><i class="fa-solid fa-lock"></i></span>
    </div>
    <h1 class="setup-title">Your free trial is over</h1>
    <p class="setup-sub">To keep using KASHFLOW Online, call or WhatsApp <strong>KB.TECH STUDIO</strong> on <strong>053&nbsp;180&nbsp;6381</strong> and share your account name below.</p>

    <div class="lock-id">
      <span>Account</span>
      <code id="lockUser">…</code>
    </div>

    <ul class="lock-contact">
      <li>
        <a class="lock-contact-link" href="tel:+233531806381"><i class="fa-solid fa-phone"></i> Call 053 180 6381</a>
      </li>
      <li>
        <a class="lock-contact-link lock-contact-wa" id="lockWhatsApp" href="#"><i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp</a>
      </li>
    </ul>

    <details class="lock-code">
      <summary>Already have a licence key?</summary>
      <form id="activateForm" class="setup-form" novalidate>
        <input id="licenseKey" class="lock-key" type="password" placeholder="Enter licence key" aria-label="Licence key" autocomplete="off" spellcheck="false" />
        <p id="lockError" class="login-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary setup-submit" id="activateBtn">Activate</button>
      </form>
    </details>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/store.js"></script>
  <script src="js/locked.js"></script>
</body>
</html>
