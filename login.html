<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login - KASHFLOW</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">
  <main class="login-card" role="main">
    <div class="brand">
      <i class="fa-solid fa-boxes-stacked brand-icon"></i>
      <span class="brand-name">KASHFLOW</span>
    </div>
    <p class="brand-sub">Inventory Management System</p>

    <div class="auth-tabs" role="tablist">
      <button type="button" id="tabLogin" class="auth-tab active" role="tab" aria-selected="true">Login</button>
      <button type="button" id="tabRegister" class="auth-tab" role="tab" aria-selected="false">Create account</button>
    </div>

    <form id="loginForm" class="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" autocapitalize="none" spellcheck="false" required />

      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
        <button type="button" id="togglePassword" class="eye-btn" aria-label="Show password">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>

      <div id="confirmWrap" hidden>
        <label for="confirmPassword">Confirm password</label>
        <div class="password-wrap">
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" autocomplete="new-password" />
          <button type="button" id="toggleConfirm" class="eye-btn" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="roleWrap">
        <label for="role">Login As</label>
        <select id="role" name="role">
          <option value="admin">Administrator</option>
          <option value="cashier">Cashier</option>
        </select>
      </div>

      <p id="loginError" class="login-error" role="alert" hidden></p>

      <button type="submit" class="btn-primary" id="authSubmit">Login</button>
    </form>
    <p id="authNote" class="auth-note">Cashiers sign in here with the username the owner created. They do not create an account.</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
