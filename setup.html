<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Welcome - KASHFLOW</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">
  <main class="login-card setup-card" role="main">
    <div class="setup-logo" aria-hidden="true"><i class="fa-solid fa-boxes-stacked"></i></div>
    <h1 class="setup-title">Start your shop</h1>
    <p class="setup-sub">Create the Administrator account. The system opens live and empty — your business, no sample products.</p>

    <form id="setupForm" class="setup-form" novalidate>
      <div class="setup-field">
        <i class="fa-solid fa-store"></i>
        <input id="setupShop" type="text" maxlength="40" placeholder="Business / shop name" aria-label="Business or shop name" autocomplete="organization" required />
      </div>

      <div class="setup-field">
        <i class="fa-regular fa-user"></i>
        <input id="setupUsername" type="text" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </div>

      <div class="setup-field">
        <i class="fa-solid fa-lock"></i>
        <input id="setupPassword" type="password" placeholder="Password (at least 6 characters)" aria-label="Password" autocomplete="new-password" required />
        <button type="button" class="setup-eye" data-eye="setupPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
      </div>

      <div class="setup-field">
        <i class="fa-solid fa-lock"></i>
        <input id="setupConfirm" type="password" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password" required />
        <button type="button" class="setup-eye" data-eye="setupConfirm" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
      </div>

      <p id="setupError" class="login-error" role="alert" hidden></p>

      <button type="submit" class="btn-primary setup-submit">Open my shop <i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <p class="setup-note"><i class="fa-solid fa-shop"></i> This computer starts a live shop: add your categories, products and barcodes, then sell on POS. Keep the Administrator password safe.</p>
  </main>

  <script src="js/store.js"></script>
  <script src="js/setup.js"></script>
</body>
</html>
